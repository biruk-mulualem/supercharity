<app-header></app-header>

<section class="media-section">
  <div class="section-header">
    <div class="section-title">
      <span></span>
      <h2>Audio</h2>
      <span></span>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Search by title or description"
        aria-label="Search audio by title or description"
      />
    </div>
  </div>

<div class="media-row grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
  <div
    class="audio-card bg-white rounded-lg overflow-hidden shadow hover:shadow-lg transition-shadow"
    *ngFor="let audio of paginatedAudios"
  >
    <!-- Image -->
      <img
        src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=800&q=80"
        alt="Audio cover"
        class="w-full h-48 object-cover"
      />

    <!-- Audio Player -->
 <audio controls [src]="staticUrl + audio.audioUrl" preload="none" class="mt-1 w-full rounded"></audio>

    <!-- Title and Date -->
    <div class="p-4 bg-gray-50">
      <h3 class="text-lg font-bold text-gray-800">{{ audio.title }}</h3>
      <p class="text-sm text-gray-600 mt-1">
        Uploaded on: {{ audio.date | date: 'longDate' }}
      </p>
    </div>
  </div>
</div>



  <!-- Pagination -->
  <div class="pagination" *ngIf="totalPages() > 1">
    <button
      (click)="changePage(currentPage - 1)"
      [disabled]="currentPage === 1"
      aria-label="Previous page"
      type="button"
    >
      Prev
    </button>

    <button
      *ngFor="let page of visiblePages()"
      (click)="changePage(page)"
      [class.active]="currentPage === page"
      aria-label="Go to page {{ page }}"
      type="button"
    >
      {{ page }}
    </button>

    <button
      (click)="changePage(currentPage + 1)"
      [disabled]="currentPage === totalPages()"
      aria-label="Next page"
      type="button"
    >
      Next
    </button>
  </div>
</section>

<app-footercard></app-footercard>
