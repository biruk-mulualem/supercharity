<app-header></app-header>
<div class="min-h-screen bg-gray-100 py-12 px-4">
  <div class="max-w-6xl mx-auto flex flex-col lg:flex-row gap-10">
    
    <!-- Left Side: Image + Raised Bar -->
    <div class="lg:w-1/2 w-full bg-white rounded-xl shadow-xl overflow-hidden">
      <img src="https://images.unsplash.com/photo-1607746882042-944635dfe10e" alt="Donation"
        class="w-full h-96 object-cover" />

      <div class="p-6">
        <p class="text-3xl font-bold text-blue-800">
          $455,900.00
          <span class="text-gray-500 text-xl font-normal">RAISED</span>
        </p>
        <div class="w-full bg-gray-300 h-2 rounded-full mt-4">
          <div class="bg-blue-600 h-2 rounded-full" style="width: 70%;"></div>
        </div>
      </div>
    </div>

    <!-- Right Side: Donation Form -->
    <div class="lg:w-1/2 w-full bg-white rounded-xl shadow-xl p-8 space-y-6">
      <h2 class="text-xl font-bold text-gray-700">Payment</h2>

      <!-- PayPal Button -->
      <button
        class="w-full bg-yellow-400 hover:bg-yellow-300 transition text-gray-900 font-bold py-3 rounded-lg shadow-md flex justify-center items-center gap-2 text-lg">
        <img src="https://www.paypalobjects.com/webstatic/icon/pp258.png" alt="PayPal" class="h-6" />
        Donate with PayPal
      </button>

      <!-- Card Icons -->
      <div class="flex justify-center gap-2 mt-2">
        <img src="https://img.icons8.com/color/48/000000/visa.png" class="h-6" />
        <img src="https://img.icons8.com/color/48/000000/mastercard-logo.png" class="h-6" />
        <img src="https://img.icons8.com/color/48/000000/amex.png" class="h-6" />
        <img src="https://img.icons8.com/color/48/000000/discover.png" class="h-6" />
      </div>

      <!-- Card Fields -->
      <form (ngSubmit)="submitDonation()" class="space-y-4">
        <input type="text" [(ngModel)]="card.name" name="name"
          placeholder="Cardholder Name (optional)"
          class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <input type="text" [(ngModel)]="card.number" name="number"
          placeholder="Card number"
          class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        
        <div class="flex gap-4">
          <input type="text" [(ngModel)]="card.expiry" name="expiry" placeholder="MM/YY"
            class="w-1/2 border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <input type="text" [(ngModel)]="card.cvv" name="cvv" placeholder="CVV"
            class="w-1/2 border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Recurring checkbox -->
        <div class="flex items-start gap-2">
          <input type="checkbox" [(ngModel)]="isRecurring" name="recurring"
            class="mt-1 accent-blue-600" />
          <label class="text-sm text-gray-600">
            Create a donor account to manage my donations and donate again faster.
          </label>
        </div>

        <!-- Donate Button -->
        <button type="submit"
          class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg text-lg transition">
          💙 Donate ${{ donationAmount }} Monthly
        </button>
      </form>

    </div>
  </div>
</div>
<app-footercard></app-footercard>
