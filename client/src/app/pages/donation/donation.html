<app-header></app-header>

<section class="max-w-lg mx-auto mt-12 bg-white p-8 rounded-lg shadow-lg">
  <h1 class="text-3xl font-bold text-center mb-6 text-gray-900">Support Our Cause</h1>

  <form (ngSubmit)="submitDonation()" class="space-y-6" novalidate>

    <!-- Name input -->
    <div class="relative">
      <input
        type="text"
        id="name"
        [(ngModel)]="donation.name"
        name="name"
        required
        autocomplete="name"
        class="peer placeholder-transparent w-full border border-gray-300 rounded-md px-3 pt-5 pb-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Your full name"
      />
      <label
        for="name"
        class="absolute left-3 top-2 text-gray-600 text-sm transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-placeholder-shown:text-base"
      >
        Full Name
      </label>
    </div>

    <!-- Email input -->
    <div class="relative">
      <input
        type="email"
        id="email"
        [(ngModel)]="donation.email"
        name="email"
        required
        autocomplete="email"
        class="peer placeholder-transparent w-full border border-gray-300 rounded-md px-3 pt-5 pb-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Your email address"
      />
      <label
        for="email"
        class="absolute left-3 top-2 text-gray-600 text-sm transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-placeholder-shown:text-base"
      >
        Email Address
      </label>
    </div>

    <!-- Donation Amount -->
    <label class="block text-gray-700 font-semibold mb-1">Choose Donation Amount (ETB)</label>

    <div class="flex flex-wrap gap-3 mb-3">
      <button
        type="button"
        *ngFor="let amt of presetAmounts"
        (click)="selectAmount(amt)"
        [class.bg-blue-600]="donation.amount === amt"
        [class.text-white]="donation.amount === amt"
        class="px-4 py-2 rounded-md border border-gray-300 hover:bg-blue-600 hover:text-white transition"
      >
        ETB {{ amt }}
      </button>
    </div>

    <div class="relative">
      <input
        type="number"
        id="amount"
        [(ngModel)]="donation.amount"
        name="amount"
        min="1"
        placeholder="Or enter custom amount"
        class="peer placeholder-transparent w-full border border-gray-300 rounded-md px-3 pt-5 pb-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      />
      <label
        for="amount"
        class="absolute left-3 top-2 text-gray-600 text-sm transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-placeholder-shown:text-base"
      >
        Custom Amount (optional)
      </label>
    </div>

    <!-- Error message -->
    <p *ngIf="error" class="text-red-600 font-semibold">{{ error }}</p>

    <!-- Success message -->
    <p *ngIf="message" class="text-green-600 font-semibold">{{ message }}</p>

    <!-- Submit button -->
    <button
      type="submit"
      [disabled]="loading"
      class="w-full py-3 bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-md font-bold shadow-md hover:from-blue-700 hover:to-blue-800 transition flex justify-center items-center"
    >
      <span *ngIf="!loading">Donate Now</span>
      <svg
        *ngIf="loading"
        class="animate-spin h-5 w-5 text-white"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
        ></path>
      </svg>
    </button>

  </form>
</section>


<app-footercard></app-footercard>
